<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
<link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <div class="time-display" id="time-display" aria-live="polite"><span class="digit" id="d-h3"></span><span class="digit" id="d-h2"></span><span class="digit" id="d-h1"></span><span class="digit" id="d-h0">0</span><span class="sep">:</span><span class="digit" id="d-m1">0</span><span class="digit" id="d-m0">0</span><span class="sep">:</span><span class="digit" id="d-s1">0</span><span class="digit" id="d-s0">0</span></div>
        <div class="button-row">
          <button type="button" class="primary-button" id="toggle-button">Start</button>
          <button type="button" class="secondary-button" id="reset-button">Reset</button>
        </div>
        <div class="dropdown-row">
          <button type="button" class="dropdown-toggle" id="settings-button" aria-label="Set time">
            <svg viewBox="0 0 20 12" width="20" height="12" aria-hidden="true">
              <polygon points="10,12 0,0 20,0"/>
            </svg>
          </button>
        </div>
        <form class="resume-form" id="resume-form" hidden>
          <label for="time-input">Continue from H:MM:SS</label>
          <div class="input-row">
            <input
              id="time-input"
              name="time-input"
              type="text"
              autocomplete="off"
              placeholder="1:30:00"
            />
            <button type="submit" class="secondary-button">Set Time</button>
          </div>
          <p class="error-message" id="error-message" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
